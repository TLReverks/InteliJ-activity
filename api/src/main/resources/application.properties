spring.application.name=api

# Permitir omitir campos primitivos (como id en POST) con Jackson 3 / Spring Boot 4
spring.jackson.deserialization.fail-on-null-for-primitives=false

# Configuración de conexión MySQL por JDBC (Puerto 3306, usuario root, sin contraseña)
spring.datasource.url=jdbc:mysql://localhost:3306/asistencia?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Logs del Sistema
logging.file.name=logs/api-asistencia.log
logging.level.root=INFO
logging.level.com.microserviceRt.api=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

